version: 2
sources:
  - name: raw
    schema: gz_raw_data
    description: raw data of greenweez
    tables:
      
      - name: sales
        identifier: raw_gz_sales
        description: sales data for greenweez
        columns:
          - name: orders_id
            description: primary key for the order
            tests:
              - not_null
        tests:
          - unique:
              column_name: "orders_id || '-' || pdt_id" 
          

      - name: product
        identifier: raw_gz_product
        description: product types of greenweez
        columns:
          - name: products_id
            description: primary key for the product data
            tests:
              - unique
              - not_null
               
      - name: ship
        identifier: raw_gz_ship
        description: shipping informations of greenweez
        columns:
          - name: orders_id
            description: primary key for the product data
            tests:
             - unique
             - not_null

      - name: adwords
        identifier: raw_gz_adwords
        description: data of adwords
        columns:
          - name: paid_source
            description: primary key for data
            tests:
            - not_null
            
          
          
          
      - name: bing
        identifier: raw_gz_bing
        description: data of bing
        columns:
          - name: paid_source
            description: primary key
            tests:
              - not_null
              
        
         
          
      - name: criteo
        identifier: raw_gz_criteo
        description: data of criteo
        columns:
          - name: paid_source
            description: primary key
            tests:
              - not_null
         
          
          
      - name: facebook
        identifier: raw_gz_facebook
        description: data of facebook
        columns:
          - name: paid_source
            description: primary key
            tests:
              - not_null

          
models:
  - name: int_campaigns_day
    description: metrics of daily campaign details
    columns:
      - name: date_date
        description: date of ads
        tests:
          - not_null
          
      - name: daily_ads_cost
        description: daily cost of ads
        tests:
          - not_null

      - name: ads_impressions
        description: daily impressions of ads
        tests:
          - not_null
          
      - name: ads_clicks
        description: daily clicks of ads
        tests:
          - not_null
          
          
        
          
          
          

        